name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -e '.[test]'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s tests/python -p 'test_*.py'
      - run: npm run privacy:scan
      - run: npm run licenses:generate
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.json
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          AUTH_PASSWORD_HASH: $2b$12$00000000000000000000000000000000000000000000000000000
          SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          COMPASS_WORKERS_JSON: "[]"
